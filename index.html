<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Página con video de fondo</title>
		<link rel="stylesheet" href="style.css">
		<!-- model-viewer for embedding 3D models -->
		<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
	</head>
	<body>
		<!-- Barra de tareas superior -->
		<nav class="topbar" role="navigation" aria-label="Barra de navegación principal">
			<div class="topbar-inner">
				<div class="brand">Arma Tu Tarrito Oficial</div>
				<button class="hamburger" aria-label="Abrir menú" aria-expanded="false">☰</button>
				<ul class="menu">
					<li><a href="#">Armador de tarrito</a></li>
					<li class="has-dropdown">
						<button class="dropbtn" aria-haspopup="true" aria-expanded="false">Productos ▾</button>
						<ul class="dropdown" aria-label="submenu productos">
							<li><a href="#">CPU</a></li>
							<li><a href="#">Gráfica</a></li>
							<li><a href="#">RAM</a></li>
							<li><a href="#">Fuente de poder</a></li>
							<li><a href="#">Tarjeta madre</a></li>
						</ul>
					</li>
					<li><a href="#">Benchmark</a></li>
					<li><a href="#">Comunidad</a></li>
					<li><a href="#">Quiero probar</a></li>
					<li><a href="#">Regístrate</a></li>
					<li><a href="#">Recibir más info</a></li>
				</ul>
			</div>
		</nav>
		<!-- Video fondo -->
		<video id="video-fondo" autoplay muted loop playsinline>
			<source src="video/video-fondo2.mp4" type="video/mp4">
			Tu navegador no soporta video HTML5.
		</video>

		<!-- Capa overlay para mejorar legibilidad -->
		<div class="overlay"></div>

		<!-- Contenido principal -->
		<main class="content">
			<h1>Bienvenido</h1>
			<p>Esta página usa un video de la carpeta <code>video/</code> como fondo.</p>
			<a class="btn" href="#">Acción</a>

			<!-- Contenedor del modelo 3D -->
			<section class="model-section" aria-label="Vista 3D del producto">
				<model-viewer src="model/scene.gltf" alt="Modelo 3D" camera-controls auto-rotate exposure="1" shadow-intensity="1" ar ar-scale="auto" style="width:100%;height:480px;"> 
				</model-viewer>
			</section>
		</main>

		<!-- Barra de contacto inferior -->
		<div class="contact-bar" id="contact-bar" role="region" aria-label="Recibir actualizaciones">
			<form id="contact-form" class="contact-form">
				<label for="contact-email" class="contact-label">Recibir actualizaciones</label>
				<input id="contact-email" name="email" type="email" placeholder="tu-correo@gmail.com" class="contact-input" required />
				<button type="submit" class="btn contact-submit">Enviar</button>
				<button type="button" class="contact-close" id="contact-close" aria-label="Cerrar">✕</button>
			</form>
			<div id="contact-msg" class="contact-msg" aria-live="polite"></div>
		</div>
+
		<script src="javascript.js"></script>
	</body>
</html>
